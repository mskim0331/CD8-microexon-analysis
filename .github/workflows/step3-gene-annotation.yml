name: Step 3 Gene Annotation

on:
  push:
    branches:
      - analysis-work
    paths:
      - "analysis/03_annotate_microexons_to_genes.py"
      - "analysis_results/01_high_quality_annotation.tsv"
      - ".github/workflows/step3-gene-annotation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  annotate-genes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r analysis/requirements.txt

      - name: Download Ensembl Release 114 GTF
        run: |
          curl -fL --retry 3 \
            -o Homo_sapiens.GRCh38.114.gtf.gz \
            https://ftp.ensembl.org/pub/release-114/gtf/homo_sapiens/Homo_sapiens.GRCh38.114.gtf.gz

      - name: Annotate microexons to genes
        run: |
          python analysis/03_annotate_microexons_to_genes.py \
            --annotation analysis_results/01_high_quality_annotation.tsv \
            --gtf Homo_sapiens.GRCh38.114.gtf.gz \
            --outdir analysis_results

      - name: Commit Step 3 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            analysis_results/03_microexon_gene_annotation.tsv \
            analysis_results/03_transcript_gene_map.tsv \
            analysis_results/03_gene_annotation_report.txt
          if git diff --cached --quiet; then
            echo "No Step 3 output changes to commit."
          else
            git commit -m "Annotate high-confidence microexons to Ensembl genes"
            git pull --rebase origin analysis-work
            git push origin analysis-work
          fi

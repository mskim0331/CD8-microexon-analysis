name: Microexon QC

on:
  push:
    branches:
      - analysis-work
    paths:
      - "analysis/01_build_microexon_qc.py"
      - "out.high_quality.txt"
      - "out_filtered_ME.PSI.txt"
      - ".github/workflows/microexon-qc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-qc:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Run structural QC
        run: |
          python analysis/01_build_microexon_qc.py \
            --high-quality out.high_quality.txt \
            --psi out_filtered_ME.PSI.txt \
            --outdir analysis_results

      - name: Commit generated QC tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_results
          if git diff --cached --quiet; then
            echo "No analysis output changes to commit."
          else
            git commit -m "Generate MicroExonator QC results"
            git push
          fi

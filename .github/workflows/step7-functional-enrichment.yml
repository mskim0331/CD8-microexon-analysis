name: Step 7 functional enrichment

on:
  push:
    branches:
      - main
      - analysis-work
    paths:
      - ".github/workflows/step7-functional-enrichment.yml"
      - "analysis/07_functional_enrichment.py"
      - "analysis_results/07_temporal_pattern_labels.tsv"
      - "analysis_results/03_microexon_gene_annotation.tsv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-enrichment:
    runs-on: ubuntu-latest

    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt
          pip install requests==2.32.5 matplotlib==3.10.6

      - name: Run gProfiler enrichment
        run: |
          python analysis/07_functional_enrichment.py \
            --patterns analysis_results/07_temporal_pattern_labels.tsv \
            --gene-annotation analysis_results/03_microexon_gene_annotation.tsv \
            --outdir analysis_results

      - name: Check outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            analysis_results/07_gprofiler_query_sets.tsv \
            analysis_results/07_gprofiler_data_versions.json \
            analysis_results/07_gprofiler_raw_results.json \
            analysis_results/07_gprofiler_enrichment.tsv \
            analysis_results/07_gprofiler_enrichment_summary.tsv \
            analysis_results/07_gprofiler_top_terms.png \
            analysis_results/07_gprofiler_top_terms.svg \
            analysis_results/07_functional_enrichment_report.txt
          do
            test -s "$f"
          done
